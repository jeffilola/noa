name: Feature
description: New capability or user-facing improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Every feature should have clear acceptance criteria before it moves to **Ready**.

  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      description: "As a [role], I want [goal], so that [benefit]"
      placeholder: As an Identity Holder, I want to see my credentials on the dashboard, so that I know what access I have.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of testable outcomes
      placeholder: |
        - [ ] Signed-in user sees credential count on `/user`
        - [ ] Empty state when API is offline
        - [ ] RBAC: only Identity Holder role can access `/user/*`
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Identity Holder (`/user`)
        - Org Admin (`/org`)
        - Security Admin
        - Compliance
        - Integrations
        - Platform Admin
        - API
        - Marketing site
        - other
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options:
        - S (< 1 day)
        - M (1–3 days)
        - L (3–5 days)
        - XL (needs spike first)
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design links, dependencies, out of scope
      placeholder: Depends on API `/credentials` scoping — already done.

  - type: checkboxes
    id: checklist
    attributes:
      label: Planning
      options:
        - label: This fits a vertical slice (API + UI + test where relevant)
          required: false
        - label: HID/Brivo live APIs are NOT required for this slice
          required: false
