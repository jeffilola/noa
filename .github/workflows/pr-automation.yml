name: PR automation

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  remind-issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const body = context.payload.pull_request.body || '';
            const hasIssue = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|relates\s+to)\s+#\d+/i.test(body);
            if (hasIssue) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const marker = '<!-- noa-pr-automation -->';
            if (comments.some((c) => c.body.includes(marker))) return;

            const message = [
              marker,
              '**Automation reminder:** Link an issue so the project board updates on merge.',
              '',
              'Add to the PR description:',
              '```',
              'Closes #123',
              '```',
              '',
              'When merged, linked issues move to **Done** on the [Noa project board](https://github.com/users/jeffilola/projects/2).',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message,
            });
